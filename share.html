<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share a Skill | LPU Skill Exchange</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>LPU Skill Exchange</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="find.html">Find a Student</a>
      <a class="active" href="share.html">Share a Skill</a>
    </nav>
  </header>

  <main class="content">
    <h2>Share a skill</h2>
    <p>Tell other LPU students what you can teach.</p>

    <form id="skillForm" class="skill-form">
      <label for="studentName">Your name</label>
      <input id="studentName" type="text" placeholder="Enter your name" required>

      <label for="skillName">Skill you can teach</label>
      <input id="skillName" type="text" placeholder="For example: Java programming" required>

      <label for="studentEmail">Gmail address</label>
      <input
        id="studentEmail"
        type="email"
        placeholder="yourname@gmail.com"
        pattern=".+@gmail\.com"
        title="Enter a Gmail address ending in @gmail.com"
        required
      >

      <label for="studyYear">Your year of study</label>
      <select id="studyYear" required>
        <option value="">Choose your year</option>
        <option>1st year</option>
        <option>2nd year</option>
        <option>3rd year</option>
        <option>4th year</option>
      </select>

      <button type="submit">Submit skill</button>
      <p id="formMessage" class="message"></p>
    </form>
  </main>

  <footer>
    <p>Peer Tutoring Platform | Lovely Professional University</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
